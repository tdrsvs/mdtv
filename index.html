<style>
/* ============ هوية See الجديدة: سينما دافئة (عنبر · يشم · قرمزي) ============ */
:root{--bg:#0c0a09;--s1:#151210;--s2:#201b17;--s3:#2b241f;--ln:#3a3029;--tx:#f6efe6;--mu:#ab9e90;--a:#ffb02e;--b:#44e0a4;--c:#ff5b3d;--r:20px;--lf:18px 5px 18px 5px;--dsp:'Reem Kufi','Tajawal',sans-serif;--ink:#1a1000;--inkb:#04201a;--tx2:#e3d9cc;--clip:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);--hclip:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px);--poa:999px 999px 18px 18px;--pbg:var(--a);--sh:none;--nz:.055;--bgfx:none}

a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none}

:focus-visible{outline:2px solid var(--b);outline-offset:2px}small{color:var(--mu)}

/* ---------- الهيكل ---------- */

/* ---------- عناصر مشتركة ---------- */

/* قسم رئيسي بترقيم تحريري */

.sh2 h2{font-family:var(--dsp);font-size:1.45rem;font-weight:700}.sh2::after{content:"";flex:1;order:5;height:1px;background:linear-gradient(to left,var(--ln),transparent)}

/* ---------- الرئيسية: البطل ---------- */

.dots{position:absolute;z-index:3;bottom:22px;inset-inline-start:22px;display:flex;gap:6px}.dots button{width:9px;height:9px;border-radius:99px;background:#ffffff55;transition:.35s}.dots .on{width:30px;background:var(--a)}

.mo.on{color:var(--tx)}.mo.on span{background:var(--a);color:var(--ink);border-color:var(--a);transform:scale(1.1) rotate(-6deg)}

.bn{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(108px,29vw,200px);gap:8px;padding:0 18px;margin-top:10px}

.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}.bn a:hover img{transform:scale(1.06)}
.bn a::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,color-mix(in srgb,var(--bg) 94%,transparent),transparent 62%)}
.bn em{position:absolute;z-index:2;top:2px;inset-inline-start:10px;font-style:normal;font-family:var(--dsp);font-size:2.6rem;line-height:1;color:transparent;-webkit-text-stroke:1.8px var(--a);direction:ltr}
.bn div{position:absolute;z-index:2;inset-inline:10px;bottom:9px}.bn b{display:block;font-size:.84rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bn>*:first-child b{font-size:1.2rem;font-family:var(--dsp)}.bn small{font-size:.72rem}
/* تذاكر العرض */
.tk{flex:0 0 min(82vw,320px);scroll-snap-align:start;display:block;filter:drop-shadow(0 10px 16px #0009)}

.tk .mn{flex:1;min-width:0;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end}.tk .mn::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,color-mix(in srgb,var(--bg) 95%,transparent),color-mix(in srgb,var(--bg) 33%,transparent))}.tk .mn>div{position:relative;z-index:1;padding:10px 14px;min-width:0;width:100%}.tk .mn b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* رحلة حول العالم + الوقت */
.lns{display:flex;gap:14px;overflow-x:auto;padding:6px 18px 14px;scrollbar-width:none}.lns::-webkit-scrollbar{display:none}

.lo svg{width:54px;height:54px;color:var(--a);animation:blink 2.6s infinite}@keyframes blink{0%,88%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}

const VB={'مشوّق ومشدود':[53,9648,80],'خفيف ومضحك':[35,10751,16],'مؤثر وعاطفي':[18,10749],'حماسي وسريع':[28,12,10759,878],'غامض ومحيّر':[9648,80,53],'دافئ ومريح':[10751,35,10749,16],'مظلم وجاد':[27,80,53,18,10752],'ملهم وعميق':[18,36,99,10752]};
const CO={'مع شريك':[10749,35,18],'مع العائلة':[10751,16,12,35],'مع الأصدقاء':[35,28,27,12]},COW={'مع شريك':'مناسب لسهرة اثنين','مع العائلة':'مناسب للعائلة','مع الأصدقاء':'ممتع مع الأصدقاء'};
const DU={'قصيرة':[60,100,1,35],'متوسطة':[100,135,35,60],'طويلة':[135,300,60,200]},QV={'الأعلى تقييمًا':7.5,'جيد وناجح':6.5,'أي تقييم':0};
const SQ=[{k:'g',m:1,t:'ما أنواع الأفلام أو المسلسلات التي تحبها؟ اختر نوعًا أو أكثر ثم اضغط «تم».',o:Object.keys(SG)},{k:'co',t:'هل ستشاهد بمفردك أم مع أحد؟',o:['بمفردي','مع شريك','مع العائلة','مع الأصدقاء']},{k:'kind',t:'تفضّل فيلمًا أم مسلسلًا؟',o:['فيلم','مسلسل','الاثنان']},{k:'du',t:'ما المدة التي تفضّلها (مدة الفيلم، أو مدة الحلقة للمسلسلات)؟',o:['قصيرة','متوسطة','طويلة','لا يهم']},{k:'vb',m:1,t:'ما الأجواء التي تبحث عنها؟ يمكنك اختيار أكثر من واحد.',o:Object.keys(VB)},{k:'q',t:'وأخيرًا، ما مستوى التقييم الذي يناسبك؟',o:['الأعلى تقييمًا','جيد وناجح','أي تقييم']}];
let SD=null;
const sdIds=l=>String(l).split('|').map(Number);
const sdSets=a=>({W:new Set(a.g.flatMap(l=>SG[l].flatMap(sdIds))),V:new Set(a.vb.flatMap(v=>VB[v])),C:new Set(CO[a.co]||[])});
function sdScore(a){const{W,V,C}=sdSets(a);return x=>{const g=gi(x);return g.filter(i=>W.has(i)).length*3+g.filter(i=>V.has(i)).length*2+g.filter(i=>C.has(i)).length*1.5+(x.vote_average||0)+Math.min(1.5,g.reduce((s,i)=>s+(S.taste[i]||0),0)*.05)-(S.cont[x.media_type+x.id]?4:0)}}
function sdWhy(x,a){const g=gi(x),gl=a.g.filter(l=>SG[l].some(v=>sdIds(v).some(n=>g.includes(n)))),vl=a.vb.filter(v=>VB[v].some(i=>g.includes(i))),p=[];
 if(gl.length)p.push('يجمع '+gl.join(' و'));if(vl.length)p.push('أجواؤه: '+vl.slice(0,2).join(' و'));if(CO[a.co]&&CO[a.co].some(i=>g.includes(i)))p.push(COW[a.co]);
 p.push('تقييمه '+vt(x)+' من '+(x.vote_count||0).toLocaleString('en-US')+' صوت');return p.join(' · ')}
async function sdFetch(){const a=SD.a,ts=a.kind=='فيلم'?['movie']:a.kind=='مسلسل'?['tv']:['movie','tv'],pg=[SD.n+1];SD.n++;
 return(await Promise.all(ts.flatMap(t=>pg.map(p=>{const tv=t=='tv',vc=tv?150:300,q={sort_by:'popularity.desc','vote_count.gte':vc,'vote_average.gte':QV[a.q],with_genres:[...new Set(a.g.flatMap(l=>sdIds(SG[l][tv?1:0])))].join('|'),page:p,language:'ar'},d=DU[a.du];
  if(d){q['with_runtime.gte']=d[tv?2:0];q['with_runtime.lte']=d[tv?3:1]}
  if(a.co=='مع العائلة'){q.without_genres=tv?'9648,80':'27,80,53';if(!tv){q.certification_country='US';q['certification.lte']='PG-13'}}
  return dsc(t,q,vc)})))).flat()}
async function sdPick(){let pool=[];for(let k=0;k<2&&pool.length<10;k++){const r=await sdFetch();r.forEach(x=>{const id=x.media_type+x.id;if(!SD.shown.has(id)&&!pool.some(z=>z.media_type+z.id==id))pool.push(x)})}
 const sc=sdScore(SD.a);return pool.sort((x,y)=>sc(y)-sc(x)).slice(0,10)}
const sdCard=(x,i,a)=>`<a class="sr" href="${href(x)}"><div class="po"><img loading="lazy" src="${IMG}w342${x.poster_path}" alt=""></div><div><span class="n">${i}</span><b class="ttl">${esc(ttl(x))}</b><small>${yr(x)} · ${TYN(x)} · ★ ${vt(x)}</small><p class="why">${esc(sdWhy(x,a))}</p>${x.overview?`<p>${esc(x.overview.slice(0,120))}…</p>`:''}</div></a>`;
function seedo(){SD={a:{},shown:new Set(),n:0};
 app.innerHTML=`<div class="sd"><div class="sdh"><i>${ic('eye')}</i><div><b>Seedo</b><small>مساعدك الذكي لاختيار ما تشاهده</small></div><button class="btn" id="sdr">${ic('refresh')}ابدأ من جديد</button></div><div id="sdc"></div></div>`;
 $('#sdr').onclick=seedo;const c=$('#sdc'),live=()=>document.body.contains(c),sv=e=>e.scrollIntoView({block:'end',behavior:'smooth'}),
 push=(h,cls)=>{const d=document.createElement('div');d.className='bb '+cls;d.innerHTML=h;c.appendChild(d);sv(d);return d},
 say=async h=>{if(!live())return;const t=push('<i></i><i></i><i></i>','bt ty');await wait(550);if(!live())return;t.className='bb bt';t.innerHTML=h;sv(t)},
 choose=q=>new Promise(res=>{const o=document.createElement('div');o.className='opt';const sel=[];o.innerHTML=q.o.map(x=>`<button>${x}</button>`).join('')+(q.m?`<button class="go">${ic('check')}تم</button>`:'');c.appendChild(o);sv(o);
  o.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('go')){if(!sel.length)return toast('اختر خيارًا واحدًا على الأقل');o.remove();return res(sel)}
   if(!q.m){o.remove();return res([b.textContent])}const x=b.textContent,i=sel.indexOf(x);i<0?sel.push(x):sel.splice(i,1);b.classList.toggle('on',i<0)}});
 (async()=>{await say(`أهلًا ${S.nm?esc(S.nm)+'، ':''}أنا <b>Seedo</b>. سأسألك بضعة أسئلة قصيرة لأفهم ما تريد مشاهدته، ثم أقترح عليك 10 أعمال تناسب إجاباتك فعلًا.`);
  for(const q of SQ){await say(q.t);if(!live())return;const r=await choose(q);SD.a[q.k]=q.m?r:r[0];push(esc(r.join('، ')),'us')}
  const a=SD.a;bump([...new Set(a.g.flatMap(l=>SG[l].flatMap(sdIds)))],2);
  await say('رائع، أحلّل تفضيلاتك وأطابقها مع الأعمال المتوفرة…');let first=1;
  for(;;){const t=push('<i></i><i></i><i></i>','bt ty');let l;try{l=await sdPick()}catch(e){l=[]}t.remove();if(!live())return;
   if(!l.length){await say(first?'لم أجد أعمالًا تطابق كل هذه الشروط. جرّب تغيير بعض إجاباتك.':'وصلنا إلى آخر ما يطابق إجاباتك. يمكنك البدء من جديد بإجابات مختلفة.');push('','').remove();const r=await choose({o:['ابدأ من جديد']});return seedo()}
   await say(first?`وجدت لك <b>${l.length}</b> اقتراحات مبنية على إجاباتك. اضغط على أي عمل لعرض تفاصيله:`:'اقتراحات إضافية تناسبك:');
   l.forEach(x=>{SD.shown.add(x.media_type+x.id);c.insertAdjacentHTML('beforeend',sdCard(x,SD.shown.size,a))});first=0;sv(c.lastElementChild);
   const r=await choose({o:['اكتشف المزيد','ابدأ من جديد']});push(r[0],'us');if(r[0]=='ابدأ من جديد')return seedo()}})()}
addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#md').classList.contains('on'))cm()});applyTheme(S.theme,1);chrome();addEventListener('hashchange',route);route();setTimeout(()=>$('#sp').classList.add('x'),4500);setTimeout(cclean,8000)
